return`<h2>Total des comptes</h2><div class=g>${K('Total',eur(cic()+ev(b.hello)+ev(b.bourso)))}</div><div class=two>${sc('CIC',`<div class=row><span>CC CIC (solde réel de <select data-p="ref" data-x=1 onchange="D.ref=+this.value;save();render()">${D.months.map((x,i)=>`<option value=${i}${i==D.ref?' selected':''}>${esc(x.name)}</option>`).join('')}</select>)</span><b>${eur(mc(m).reel)}</b></div><div class=row><span>Épargne CIC</span><span style="width:130px">${inp('banks.cic',b.cic,1)}</span></div>`,eur(cic()))}${sc('HelloBank',inp('banks.hello',b.hello,1))}${sc('BoursoBank',inp('banks.bourso',b.bourso,1))}</div>`},
res(){const p=pr();
return`<h2>Prévision réserve</h2><div class=g>${K('Total réserve prévu',eur(p.tgt))}${K('Déjà mis en réserve',eur(p.dn))}${K('Reste à mettre',eur(p.tgt-p.dn),cc(p.tgt-p.dn))}${K('Mois validés',p.n+' / '+D.pr.rows.length+(p.p?' · '+p.p+' partiel':''))}</div><div class=bar><i style="width:${Math.min(100,p.dn/(p.tgt||1)*100)}%"></i></div>${sc('Plan mensuel · réserve existante : '+inp('pr.base',D.pr.base,1),tb('pr.rows',['Mois','Réserve salaire','Gratification','Complément','Sorties','Total mois','Statut','Montant partiel','Cumul'],[['t'],['x'],['x'],['x'],['x'],(r,i)=>eur(p.rows[i].t),['s',['Oui','Non','Partiellement']],['x'],(r,i)=>eur(p.rows[i].c)],['','','','','','Non','']))}${sc('Paramètres',`<div class=g style="margin:0">${D.pr.par.map((x,i)=>`<label class=mu>${esc(x[0])}${inp('pr.par.'+i+'.1',x[1],1)}</label>`).join('')}</div>`)}`},
crs(){const l=D.lists[li],c=lc(l),P=`lists.${li}`;
return`<h2>Courses</h2>`+tabs(D.lists.map(x=>x.name),li,'li',`<button class=sm onclick="addL()">+ Liste</button><button class=sm onclick="D.lists[li].name=prompt('Nom',D.lists[li].name)||D.lists[li].name;save();render()">Renommer</button><button class=sm onclick="delL()">Supprimer</button>`)+
`<div class=g>${K('Total',eur(c.t))}${K('Déjà acheté',eur(c.b))}${K('Reste à acheter',eur(c.t-c.b))}${K('Avancement',c.a)}</div><div class=two>${l.stores.map((s,i)=>sc(inp(`${P}.stores.${i}.n`,s.n),tb(`${P}.stores.${i}.items`,['Article','Qté','Prix','Statut'],[['t'],['t'],['x'],['s',ST.c]],['','x1','','À acheter']),eur(S(s.items,r=>ev(r[2]))))).join('')}</div><button onclick="l=D.lists[li];l.stores.push({n:'NOUVEAU MAGASIN',items:[]});save();render()">+ Magasin</button>`},
cours(){const b=D.cours[ci],t=D.cours.map(cm),T=k=>S(t,x=>x[k]),c=t[ci];
return`<h2>Suivi des cours particuliers</h2><div class=g>${K('Total prévu (hors annulé)',eur(T('pv')))}${K('Déjà reçu',eur(T('rc')),'pos')}${K('En attente',eur(T('at')))}${K('→ Compte courant',eur(T('cc')))}${K('→ Épargne',eur(T('ep')))}</div>`+tabs(D.cours.map(x=>x.n.slice(0,3)+' '+x.n.slice(-2)),ci,'ci')+`<div class=g>${K('Prévu',eur(c.pv))}${K('Reçu',eur(c.rc),'pos')}${K('En attente',eur(c.at))}${K('→ CC',eur(c.cc))}${K('→ Épargne',eur(c.ep))}</div>${sc(esc(b.n),tb('cours.'+ci+'.rows',['Séance (date)','Montant','Statut','Destination'],[['d'],['x'],['s',ST.k],['s',['Compte courant','Épargne','À définir']]],['','','En attente','Compte courant']))}`},
set(){return`<h2>Données & sauvegarde</h2>${sc('Sauvegarde',`<div class=tabs><button class=pr onclick="xl()">⬇ Exporter vers Excel</button><button onclick="jx()">Copie JSON</button><button onclick="document.getElementById('fi').click()">Restaurer un JSON</button><button onclick="if(confirm('Tout remettre aux données du fichier Excel d’origine ?')){D=JSON.parse(JSON.stringify(SEED));save();render()}">Réinitialiser</button><input id=fi type=file accept=.json hidden onchange="imp(this)"></div><p class=mu>Les données restent dans ce navigateur (stockage local de cet appareil), sans serveur ni connexion bancaire. Téléphone et ordinateur ne se synchronisent pas : utilise « Copie JSON » puis « Restaurer ».</p>`)}`}};
const NV=[['dash','📊','Tableau de bord'],['mois','📅','Solde du mois'],['gb','🎯','Gestion budget'],['cf','📉','Charges fixes/var.'],['cpt','🏦','Comptes'],['res','💎','Prév. réserve'],['crs','🛒','Courses'],['cours','🎓','Suivi cours'],['set','⚙️','Données']];
function render(){$('#nav').innerHTML='<h1>💼 Mes Finances</h1>'+NV.map(n=>`<a class="${n[0]==V?'on':''}" onclick="V='${n[0]}';render();scrollTo(0,0)">${n[1]} ${n[2]}</a>`).join('');$('#main').innerHTML=VW[V]();if(lf){const n=document.querySelector(`[data-p="${lf}"]`);if(n)n.focus({preventScroll:true})}}
const $=s=>document.querySelector(s);
document.addEventListener('focusin',e=>{lf=e.target.dataset&&e.target.dataset.p||''});
function U(e){const p=e.dataset.p.split('.'),k=p.pop(),o=p.reduce((o,k)=>o[k],D);let v=e.value;if(e.dataset.x=='1'&&/^-?\d+([.,]\d+)?$/.test(v))v=parseFloat(v.replace(',','.'));o[k]=v;save();setTimeout(render,0)}
const A=(p,d)=>{gp(p).push(d);lf='';save();render()},X=(p,i)=>{if(confirm('Supprimer cette ligne ?')){gp(p).splice(i,1);lf='';save();render()}};
function addM(){const n=prompt('Nom du mois (ex : SOLDE 12)');if(!n)return;D.months.push({name:n,cc:[['','']],dep:[],ent:[],res:[]});mi=D.months.length-1;save();render()}
function renM(){const n=prompt('Nouveau nom',D.months[mi].name);if(n){D.months[mi].name=n;save();render()}}
function delM(){if(D.months.length>1&&confirm('Supprimer ce mois ?')){D.months.splice(mi,1);mi=0;D.ref=Math.min(D.ref,D.months.length-1);D.dm=Math.min(D.dm,D.months.length-1);save();render()}}
function addL(){const n=prompt('Nom de la liste');if(n){D.lists.push({name:n,stores:[{n:'MAGASIN',items:[]}]});li=D.lists.length-1;save();render()}}
function delL(){if(D.lists.length>1&&confirm('Supprimer cette liste ?')){D.lists.splice(li,1);li=0;D.dl=Math.min(D.dl,D.lists.length-1);save();render()}}
function dl(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
const jx=()=>dl('finances-sauvegarde.json',new Blob([JSON.stringify(D)]));
function imp(i){i.files[0].text().then(t=>{try{D=JSON.parse(t);save();render()}catch(e){alert('Fichier invalide')}})}
function xl(){if(!window.XLSX)return alert('Export Excel : connexion internet requise une fois (bibliothèque).');const w=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet(a),n.slice(0,30));
D.months.forEach(m=>add(m.name,[['SOLDE CC'],...m.cc.map(r=>[r[0],ev(r[1])]),[],['FUTURES DÉPENSES','Reste','Payé','Statut'],...m.dep.map(r=>[r[0],ev(r[1]),ev(r[2]),r[3]]),[],['FUTURES ENTRÉES'],...m.ent.map(r=>[r[0],ev(r[1]),r[2]]),[],['RÉSERVES'],...m.res.map(r=>[ev(r[0]),r[1]])]));
add('Gestion budget',[['Revenus'],...D.gb.rev.map(r=>[r[0],ev(r[1])]),[],['Charges fixes'],...D.gb.cf.map(r=>[r[0],ev(r[1]),r[2]]),[],['Budget variable'],...D.gb.cv.map(r=>[r[0],ev(r[1])]),[],['En réserve',ev(D.gb.res)]]);
const p=pr();add('Prév réserve',[['Mois','Salaire','Gratif','Compl.','Sorties','Total','Statut','Partiel','Cumul'],['Réserve existante',,,,,ev(D.pr.base),'Acquise'],...D.pr.rows.map((r,i)=>[r[0],ev(r[1]),ev(r[2]),ev(r[3]),ev(r[4]),p.rows[i].t,r[5],ev(r[6]),p.rows[i].c])]);
D.lists.forEach(l=>add(l.name,l.stores.flatMap(s=>[[s.n],...s.items.map(r=>[r[0],r[1],ev(r[2]),r[3]]),[]])));
add('Suivi cours',D.cours.flatMap(b=>[[b.n],...b.rows.map(r=>[r[0],ev(r[1]),r[2],r[3]]),[]]));
add('Comptes',[['CIC (CC)',mc(D.months[D.ref]).reel],['Épargne CIC',ev(D.banks.cic)],['HelloBank',ev(D.banks.hello)],['BoursoBank',ev(D.banks.bourso)]]);
dl('mes-finances.xlsx',new Blob([XLSX.write(w,{type:'array',bookType:'xlsx'})]))}
render();
</script></body></html>
